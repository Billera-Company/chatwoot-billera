<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="url(#primaryGradient)" />
  
  <!-- Chat bubbles group -->
  <g>
    <!-- Left bubble (email/message) -->
    <path d="M 60 100 L 110 100 Q 120 100 120 110 L 120 140 Q 120 150 110 150 L 70 150 L 60 165 L 65 150 L 60 150 Q 50 150 50 140 L 50 110 Q 50 100 60 100" 
          fill="#3b82f6" opacity="0.9"/>
    <line x1="60" y1="115" x2="105" y2="115" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="130" x2="105" y2="130" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right bubble (chat) -->
    <path d="M 140 170 L 220 170 Q 235 170 235 185 L 235 220 Q 235 235 220 235 L 160 235 L 145 250 L 155 235 L 140 235 Q 125 235 125 220 L 125 185 Q 125 170 140 170" 
          fill="url(#accentGradient)"/>
    <line x1="145" y1="190" x2="220" y2="190" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="210" x2="220" y2="210" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dots -->
    <circle cx="150" cy="215" r="2.5" fill="white" opacity="0.7"/>
    <circle cx="160" cy="215" r="2.5" fill="white" opacity="0.7"/>
    <circle cx="170" cy="215" r="2.5" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Accent elements -->
  <circle cx="75" cy="85" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="240" cy="245" r="3" fill="#3b82f6" opacity="0.5"/>
</svg>